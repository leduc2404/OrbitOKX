# ==================== POOL NỘI DUNG & PROMPT HỢP NHẤT (UNIFIED POOL) ====================
# Toàn bộ tài khoản active dùng chung tất cả các nguồn cào (binance, okx, sosovalue, KuCoin, okx_trending)
# và xoay vòng chung toàn bộ 20 prompt variants từ cả 2 thư mục (group1 + group2).
content_pool:
  sources: ["binance", "okx", "sosovalue", "KuCoin", "okx_trending"]
  prompt_variants_dirs:
    - "config/prompts/group1"
    - "config/prompts/group2"
  prompt_templates_fallback:
    - "config/gemini_prompt_template_group1.txt"
    - "config/gemini_prompt_template.txt"
  # Định cỡ buffer chính xác theo công suất thực tế:
  # target_ready = max(min_ready_buffer, ceil(active_accounts * planning_hourly_capacity * runway_hours))
  runway_hours: 1.5
  min_ready_buffer: 5
  low_watermark_ratio: 0.35

# ==================== XOAY VÒNG PROMPT (ANTI-DUPLICATE CONTENT) ====================
prompt_rotation:
  enabled: true     # false = luôn dùng variant đầu tiên (chế độ debug)
  avoid_recent: 8   # Không lặp lại 8 variant vừa dùng gần nhất trên pool 20 prompt hợp nhất

