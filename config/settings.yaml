# ==================== TÀI KHOẢN ĐĂNG BÀI ====================
# Danh sách account ĐANG BẬT để đăng bài.
# Mỗi số tương ứng file cookie: cookies/account{N}.json
# Ví dụ: [1, 2, 4] → dùng account1.json, account2.json, account4.json
# Muốn tắt account 2 → xóa số 2 khỏi mảng: [1, 4]
acc_activity: [1]

# Khoảng thời gian nghỉ ngẫu nhiên giữa 2 bài đăng của mỗi tài khoản tiếp theo (Giây)
# Đây là interval NỀN. Nhịp thực tế = interval nền x hệ số khung giờ (posting_schedule bên dưới).
# Median nền = 1125s -> với hourly_multipliers bên dưới ra ~80 bài/ngày/account:
#   bài nhanh nhất 04:00 ~6.4 bài/giờ, bài chậm nhất 21:00 ~1.45 bài/giờ (69 phút/bài)
delay_between_posts_seconds:
  min: 650
  max: 1600

# ==================== LỊCH ĐĂNG BÀI THEO KHUNG GIỜ ====================
# Thay vì đăng đều một nhịp, interval giữa 2 bài được nhân với hệ số của khung giờ hiện tại.
#   multiplier < 1 -> rút ngắn interval -> đăng DÀY hơn (khung giờ nhiều view)
#   multiplier > 1 -> giãn interval     -> đăng THƯA hơn (khung giờ tắc nghẽn)
# Hệ số suy ra từ thống kê median view/giờ của OKX Orbit, tính theo giờ Việt Nam (UTC+7).
posting_schedule:
  enabled: true

  # Múi giờ dùng để xác định khung giờ. 7 = giờ Việt Nam. Bỏ trống/null = dùng giờ hệ thống.
  utc_offset_hours: 7

  # Nhiễu ngẫu nhiên ±15% trên interval để nhịp không đều tăm tắp như máy.
  jitter: 0.15

  # Interval không bao giờ xuống dưới ngưỡng này (giây), kể cả khung giờ nhanh nhất.
  min_interval_seconds: 60

  # Buffer crawl/Gemini được định cỡ theo khung giờ đăng NHANH NHẤT trong N giờ tới,
  # tránh hụt bài khi chuyển từ giờ nghẽn (21:00) sang giờ vàng (22:00-05:00).
  planning_horizon_hours: 3

  # ----- CHẾ ĐỘ RIÊNG CHO TỪNG NGÀY (né pattern lặp lại giữa các ngày) -----
  # Mỗi ngày lấy 1 cường độ riêng: ngày vội đăng dày, ngày chậm đăng thưa.
  # Kèm theo đó mỗi khung giờ trong ngày bị lệch thêm ±hourly_shape_noise,
  # nên đường cong giờ-ngày hôm nay không trùng y hệt hôm qua.
  # Random theo seed + YYYY-MM-DD -> ổn định cả ngày, restart không đổi nhịp.
  # Số bài/ngày tỉ lệ thuận intensity (vì intensity chia thẳng vào interval), nên
  # khoảng đối xứng 0.80-1.20 quanh 1.0 giữ trung bình ~80 bài/ngày và dao động ~63-95.
  daily_variation:
    enabled: true
    volume_min: 0.80     # ngày chậm nhất: mọi interval x1.25
    volume_max: 1.20     # ngày nhanh nhất: mọi interval x0.83
    hourly_shape_noise: 0.10
    seed: "orbit-vn-2026"

  hourly_multipliers:
    0: 0.75   # 00:00 - 01:00: Đêm muộn, phiên Mỹ sôi động (Median View: 10,632) -> Rút ngắn interval 25%
    1: 0.75   # 01:00 - 02:00: Sóng đêm (Median View: 12,140) -> Rút ngắn 25%
    2: 0.85   # 02:00 - 03:00: (Median View: 2,874)
    3: 0.80   # 03:00 - 04:00: (Median View: 9,692)
    4: 0.60   # 04:00 - 05:00: ĐỈNH KIM CƯƠNG TOÀN NGÀY (Median View: 31,313) -> Tăng tốc 40%
    5: 0.65   # 05:00 - 06:00: GIỜ VÀNG (Median View: 14,400) -> Tăng tốc 35%
    6: 0.70   # 06:00 - 07:00: Trước giờ đóng nến ngày 07:00 AM (Median View: 16,728) -> Tăng tốc 30%
    7: 1.00   # 07:00 - 08:00: Đóng nến ngày, thị trường tái định vị
    8: 0.85   # 08:00 - 09:00: Châu Á mở app sáng đi làm (Median View: 3,167)
    9: 0.90   # 09:00 - 10:00: Buổi sáng hoạt động tốt (Median View: 1,934)
    10: 1.00  # 10:00 - 11:00: Nhịp độ tiêu chuẩn
    11: 1.10  # 11:00 - 12:00: Chuẩn bị nghỉ trưa
    12: 1.10  # 12:00 - 13:00: Giờ ăn trưa
    13: 1.15  # 13:00 - 14:00: Đầu giờ chiều ít biến động
    14: 1.20  # 14:00 - 15:00: Thanh khoản châu Á giảm
    15: 1.15  # 15:00 - 16:00: Phiên Âu bắt đầu rục rịch
    16: 1.10  # 16:00 - 17:00: Phiên Âu vào guồng
    17: 1.15  # 17:00 - 18:00: Tan tầm
    18: 1.20  # 18:00 - 19:00: Ăn tối
    19: 1.40  # 19:00 - 20:00: Bắt đầu tắc nghẽn, giãn cách dần
    20: 1.80  # 20:00 - 21:00: GIỜ ĐỎ: Lượng bài cạnh tranh tăng vọt, view tụt dốc -> Đăng thưa
    21: 2.20  # 21:00 - 22:00: TẮC NGHẼN CỰC ĐẠI (54 bài/giờ, Median view chỉ 54) -> Giãn cách cực đại
    22: 0.85  # 22:00 - 23:00: Dòng tiền Mỹ thức giấc, thoát nghẽn (Median View: 3,244) -> Đẩy bài lại
    23: 0.80  # 23:00 - 24:00: Đón sóng đêm muộn (Median View: 3,037, Mean: 20,992)

