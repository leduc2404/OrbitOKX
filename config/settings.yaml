  # --- SoSoValue Crawler ---
  soso_enabled: true

  # Số luồng chạy song song tối đa
  max_workers: 3

  # Delay giữa mỗi tác giả trong cùng 1 luồng (Giây)
  delay_between_authors: 2

  # Số lần thử lại tối đa khi gặp lỗi HTTP hoặc Rate Limit
  max_retries: 3

  # Thời gian chờ giữa mỗi lần retry (Giây, sẽ nhân đôi mỗi lần - Exponential Backoff)
  retry_delay: 5

  # Khoảng thời gian giữa các chu kỳ crawl (Phút)
  crawl_interval_minutes: 10

  # Nếu chưa từng crawl tác giả này → mặc định lấy bài trong X giờ gần nhất
  default_lookback_hours: 2

  # --- ADAPTIVE QUEUE CONTROL & GEMINI QUOTA OPTIMIZATION ---
  # Buffer 'ready' được định cỡ tự động theo:
  #   target_ready = max(min_ready_buffer, ceil(active_accounts * planning_hourly_capacity * runway_hours))
  # Khi ready + crawled >= target_ready -> tự động dừng cào bài mới.
  # Khi ready >= target_ready -> tự động dừng gọi Gemini (tiết kiệm 100% token thừa).
  runway_hours: 1.5
  min_ready_buffer: 5
  low_watermark_ratio: 0.35
  # Có thể ép cứng trần buffer nếu muốn (mặc định để tự động theo số account active):
  # max_ready_buffer: 10


# ==================== CẤU HÌNH FARMING (ORGANIC ENGAGEMENT ENGINE) ====================
farming:
  enabled: true

  # Danh sách account dùng cho farming (số tương ứng cookies/account{N}.json)
  accounts: [1]

  # --- SESSION CONTROL ---
  posts_per_session: 60          # ~60 views/session → 1 session ≈ 12-18 phút
  min_interval_seconds: 7        # Tối thiểu 7s giữa mỗi bài → ~500 views/h

  # --- NHỊP SINH HỌC (CIRCADIAN REST) ---
  session_break_minutes: [3, 8]        # Nghỉ ngắn giữa sessions [min, max] Gaussian
  sessions_before_long_break: 5        # Sau N sessions → nghỉ dài
  long_break_minutes: [10, 20]         # Nghỉ dài [min, max] Gaussian

  # --- TỈ LỆ TƯƠNG TÁC (RELAXED — tăng tần suất, ưu tiên followed) ---
  # Followed authors: gấp đôi tỷ lệ tương tác so với trước
  # Unfollowed authors: nới lỏng ~60-70% so với trước
  followed_author:
    skip_rate: 0.02
    like_rate: 0.30
    comment_rate: 0.25
    deep_dive_rate: 0.10

  unfollowed_author:
    skip_rate: 0.05
    like_rate: 0.08
    comment_rate: 0.06
    follow_rate: 0.02
    deep_dive_rate: 0.05

  # --- GAUSSIAN DELAYS [mean, std, min] ---
  delays:
    scroll:         [1.2, 0.4, 0.3]
    read_short:     [3.0, 1.0, 1.0]
    read_long:      [5.0, 1.5, 2.0]
    after_like:     [0.8, 0.2, 0.3]
    after_comment:  [3.0, 1.0, 1.5]
    after_follow:   [1.0, 0.3, 0.3]
    deep_dive_scan: [2.0, 0.6, 0.5]
    deep_dive_read: [3.0, 1.0, 1.0]

  # --- AI COMMENT ---
  # Provider cho farming comment: "gemma" | "gemini_proxy" | "gemini_direct"
  # Dùng đúng provider đã cấu hình trong config/gemini.yaml
  # Chỉ cần chỉnh 1 dòng này để đổi model/api cho farming comment
  ai_provider: "gemini_proxy"

  comment_prompt_file: "config/farming_comment_prompt.txt"
  comment_max_length: 150
  comment_min_length: 5

  # --- DEEP DIVE ---
  deep_dive:
    max_old_posts: 2
    like_old_post_rate: 0.15

  # --- TRÍ NHỚ NGẮN HẠN (Short-term Memory) — RELAXED ---
  short_term_memory:
    enabled: true
    like_cooldown_hours: 0.5         # Nới lỏng: 30 phút (trước: 1h)
    comment_cooldown_hours: 1.0      # Nới lỏng: 1h (trước: 2h)
    deep_dive_cooldown_hours: 3.0    # Nới lỏng: 3h (trước: 6h)

  # --- ƯU TIÊN KOL CÓ NHIỀU VIEW & CHƯA FOLLOW ---
  kol_focus:
    enabled: true
    high_view_threshold: 5000              # KOL là người có view post > mức này
    multiplier_high_view: 2.0             # Nhân đôi tỷ lệ tương tác (like, comment, follow) cho KOL
    multiplier_high_view_unfollowed: 3.0  # Nhân ba tỷ lệ tương tác nếu đó là KOL mà mình CHƯA FOLLOW
