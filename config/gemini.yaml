  # Model cascade: thử primary → fallback khi 429/quota
  # priority 1 = thử trước, priority 2 = fallback
  models:
    - name: "gemma-4-31b-it"
      rpm: 15
      tpm: 99999999
      rpd: 1500
      priority: 1
    - name: "gemma-3-27b-it"
      rpm: 15
      tpm: 99999999
      rpd: 1500
      priority: 2             # Fallback model

  rate_limiting:
    rpm_per_key: 15             # Sliding Window: requests per minute per key
    penalty_cooldown: 60        # Penalty duration khi bị 429 (giây)
    tpm_per_key: 99999999       # Tokens per minute per key
    rpd_per_key: 1500           # Requests per day per key
    model_fallback_enabled: true  # Bật auto-fallback khi primary 429
    all_keys_exhausted_wait: 15   # Đợi N giây khi TẤT CẢ keys penalty

  processing:
    parallel_mode: true         # Mỗi key 1 luồng độc lập   
    max_workers: null            # null = tự tính = số API keys   
    retry_attempts: 3   
    retry_delay: 2              # Delay giữa các retry (giây)   
    request_timeout: 60         # Timeout cho mỗi API call (giây)   
    model_cooldown_seconds: 40  # Cooldown khi model hết quota   
   
  generation:   
    temperature: 0.65   
    top_p: 0.8   
    top_k: 40   
    max_output_tokens: 2048   
   

# ============================================================
# GEMINI PROXY - Gọi qua proxy trung gian (OpenAI-compatible)
# Dùng google.generativeai + transport="rest" + custom endpoint
# ============================================================
gemini_proxy:
  enabled: true
  
  api_key: "sk-ffcdfc36699c4519a730add352403878"
  endpoint: "http://localhost:8045/v1"
  model: "gemini-3-flash"

  rate_limiting:
    min_delay_seconds: 1        # Delay tối thiểu giữa các request
    cooldown_seconds: 40        # Cooldown khi model hết quota

  processing:
    max_workers: 10              # Số luồng xử lý đồng thời
    retry_attempts: 3
    retry_delay: 2
    request_timeout: 60

  generation:
    temperature: 0.8
    top_p: 0.8
    top_k: 40
    max_output_tokens: 2048


# ============================================================
# GEMINI DIRECT - Gọi trực tiếp Google API (không qua proxy)
# Dùng google.genai Client (giống Gemma nhưng model Gemini)
# ============================================================
gemini_direct:
  enabled: false
  
  api_keys: []
  model: "gemini-2.5-flash"

  rate_limiting:
    rpm_per_key: 10             # Requests per minute per key
    penalty_cooldown: 60        # Penalty khi bị 429

  processing:
    parallel_mode: true         # true = mỗi key 1 luồng, false = round-robin
    max_workers: null            # null = tự tính = số API keys
    retry_attempts: 3
    retry_delay: 2
    request_timeout: 60
    cooldown_seconds: 40

  generation:
    temperature: 0.65
    top_p: 0.8
    top_k: 40
    max_output_tokens: 2048


# ============================================================
# PROCESSING CHUNG (áp dụng cho mọi provider)
# ============================================================
processing:
  include_images: false

  # Post-level retry (xử lý lại bài viết bị lỗi)
  max_post_retries: 3
  retry_failed_in_next_cycle: true
  failed_post_cooldown_minutes: 5
